# ================================================================
# OIL & GAS INDUSTRY — Entity Overlay  (self-contained)
# ================================================================
# Merged from: maintenance, reliability, asset_integrity,
#              process_optimization, sustainability_esg
#              + oil & gas-specific extensions.
# Standards: ISO 14224, API 580/581, IEC 61511, GHG Protocol
# ================================================================

entities_overlay:

  # ── Equipment extensions (O&G-specific + reliability + integrity) ─────────────
  equipment:
    additional_attributes:
      # Oil & gas-specific
      process_unit:
        from: [sap_assets.process_unit]
        required: false
        description: "Process unit the equipment belongs to (CDU, VDU, FCC, etc.)"
      pressure_rating_psig:
        from: [sap_assets.pressure_rating_psig, documents.pressure_rating_psig]
        required: false
      temperature_rating_f:
        from: [sap_assets.temperature_rating_f, documents.temperature_rating_f]
        required: false
      api_equipment_type:
        from: [sap_assets.api_equipment_type, documents.api_equipment_type]
        required: false
        description: "API classification for the equipment"
      corrosion_loop:
        from: [documents.corrosion_loop]
        required: false
        description: "Corrosion loop identifier (CML grouping)"
      sil_level:
        from: [documents.sil_level]
        required: false
        description: "Safety Integrity Level (SIL) rating"
      # Reliability (ISO 14224)
      equipment_class_code:
        from: [sap_assets.equipment_class_code, documents.equipment_class_code]
        required: false
      installation_date:
        from: [sap_assets.installation_date, documents.installation_date]
        required: false
      design_life_years:
        from: [sap_assets.design_life_years, documents.design_life_years]
        required: false
      # Integrity (API 510/570)
      design_pressure:
        from: [documents.design_pressure]
        required: false
      design_temperature:
        from: [documents.design_temperature]
        required: false
      material_of_construction:
        from: [documents.material_of_construction]
        required: false
      corrosion_allowance_mm:
        from: [documents.corrosion_allowance]
        required: false
      rbi_date:
        from: [documents.rbi_date]
        required: false

  # ── Work order extensions (maintenance + O&G-specific) ───────────────────────
  work_order:
    additional_attributes:
      actual_start:
        from: [sap_wo.actual_start]
        required: false
      actual_finish:
        from: [sap_wo.actual_finish]
        required: false
      downtime_hours:
        from: [sap_wo.downtime_hours]
        required: false
      labor_hours:
        from: [sap_wo.labor_hours]
        required: false
      maintenance_classification:
        from: [sap_wo.maintenance_classification]
        required: false
        description: "ISO 14224: corrective | preventive | predictive | condition_based"
      cost_total:
        from: [sap_wo.cost_total]
        required: false
      # O&G-specific
      management_of_change:
        from: [sap_wo.management_of_change]
        required: false
        description: "Whether a MOC is required for this work"
      permit_to_work:
        from: [sap_wo.permit_to_work]
        required: false
        description: "PTW reference number"
      turnaround_scope:
        from: [sap_wo.turnaround_scope]
        required: false
        description: "Part of planned turnaround/shutdown scope"
      process_safety_relevant:
        from: [sap_wo.process_safety_relevant]
        required: false
        description: "Flagged as process-safety relevant work"

  # ── Notification extensions (maintenance) ────────────────────────────────────
  notification:
    additional_attributes:
      consequence_code:
        from: [sap_notification.consequence_code]
        required: false
      detection_method_code:
        from: [sap_notification.detection_method_code]
        required: false
      downtime_hours:
        from: [sap_notification.downtime_hours]
        required: false

  # ── Asset Strategy (maintenance — ISO 55000 / ISO 14224) ─────────────────────
  asset_strategy:
    canonical_table: asset_strategy
    identity_keys: [plant_code_id, normalized_asset]
    sources: [sap_assets, documents]
    attributes:
      plant_code_id:
        from: [sap_assets.plant_code_id]
        required: true
      normalized_asset:
        from: [sap_assets.normalized_asset]
        required: true
      strategy_type:
        from: [documents.strategy_type]
        required: false
        description: "run_to_failure | time_based | condition_based | predictive | proactive"
      criticality_rank:
        from: [sap_assets.criticality, documents.criticality_rank]
        required: false
      review_date:
        from: [documents.review_date]
        required: false

  # ── Repair Action (maintenance — ISO 14224 Section 9) ────────────────────────
  repair_action:
    canonical_table: repair_action
    identity_keys: [plant_code_id, wo_number, action_seq]
    sources: [sap_wo]
    attributes:
      plant_code_id:
        from: [sap_wo.plant_code_id]
        required: true
      wo_number:
        from: [sap_wo.wo_number]
        required: true
      action_seq:
        from: [sap_wo.operation_no]
        required: true
      action_type:
        from: [sap_wo.activity_type]
        required: false
        description: "repair | replace | adjust | overhaul | modify | inspect"
      component_replaced:
        from: [sap_wo.component]
        required: false
      spare_material_code:
        from: [sap_wo.material_code]
        required: false
      labor_hours:
        from: [sap_wo.labor_hours]
        required: false

  # ── Equipment Class Taxonomy (reliability — ISO 14224) ───────────────────────
  equipment_class_taxonomy:
    canonical_table: equipment_class_taxonomy
    identity_keys: [class_code]
    sources: [standards, documents]
    attributes:
      class_code:
        from: [standards.class_code]
        required: true
      class_name:
        from: [standards.class_name]
        required: true
      parent_class_code:
        from: [standards.parent_class_code]
        required: false
      level:
        from: [standards.level]
        required: true
      equipment_category:
        from: [standards.equipment_category]
        required: false
        description: "rotating | static | electrical | instrument | safety | piping"
      typical_failure_modes:
        from: [standards.typical_failure_modes]
        required: false

  # ── Reliability KPI (reliability) ────────────────────────────────────────────
  reliability_kpi:
    canonical_table: reliability_kpi
    identity_keys: [plant_code_id, normalized_asset, period_start]
    sources: [computed]
    attributes:
      plant_code_id:
        from: [computed.plant_code_id]
        required: true
      normalized_asset:
        from: [computed.normalized_asset]
        required: true
      period_start:
        from: [computed.period_start]
        required: true
      period_end:
        from: [computed.period_end]
        required: true
      mtbf_hours:
        from: [computed.mtbf_hours]
        required: false
      mttr_hours:
        from: [computed.mttr_hours]
        required: false
      mdt_hours:
        from: [computed.mdt_hours]
        required: false
      availability:
        from: [computed.availability]
        required: false
      failure_rate:
        from: [computed.failure_rate]
        required: false
      failure_count:
        from: [computed.failure_count]
        required: false
      total_downtime_hours:
        from: [computed.total_downtime_hours]
        required: false
      total_operating_hours:
        from: [computed.total_operating_hours]
        required: false

  # ── Operating State Log (reliability) ────────────────────────────────────────
  operating_state_log:
    canonical_table: operating_state_log
    identity_keys: [plant_code_id, normalized_asset, state_start]
    sources: [sap_wo, timeseries, documents]
    attributes:
      plant_code_id:
        from: [sap_wo.plant_code_id, timeseries.plant_code_id]
        required: true
      normalized_asset:
        from: [sap_wo.normalized_asset, timeseries.normalized_asset]
        required: true
      state_start:
        from: [sap_wo.actual_start, timeseries.state_start]
        required: true
      state_end:
        from: [sap_wo.actual_finish, timeseries.state_end]
        required: false
      operating_state:
        from: [sap_wo.operating_state, timeseries.operating_state]
        required: true
        description: "running | standby | planned_shutdown | unplanned_shutdown | maintenance"

  # ── Inspection Record (asset integrity — API 510/570/653) ────────────────────
  inspection_record:
    canonical_table: inspection_record
    identity_keys: [plant_code_id, inspection_id]
    sources: [documents, sap_wo]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id, sap_wo.plant_code_id]
        required: true
      inspection_id:
        from: [documents.inspection_id, sap_wo.inspection_id]
        required: true
      normalized_asset:
        from: [documents.normalized_asset, sap_wo.normalized_asset]
        required: true
      inspection_type:
        from: [documents.inspection_type]
        required: true
        description: "visual | ultrasonic | radiographic | magnetic_particle | dye_penetrant | eddy_current | acoustic_emission"
      inspection_date:
        from: [documents.inspection_date, sap_wo.actual_finish]
        required: true
      next_inspection_date:
        from: [documents.next_inspection_date]
        required: false
      inspector:
        from: [documents.inspector]
        required: false
      result:
        from: [documents.result]
        required: false
        description: "pass | conditional | fail"
      findings:
        from: [documents.findings]
        required: false
      recommendations:
        from: [documents.recommendations]
        required: false

  # ── Corrosion Loop (asset integrity — API 580/581 RBI) ───────────────────────
  corrosion_loop:
    canonical_table: corrosion_loop
    identity_keys: [plant_code_id, loop_id]
    sources: [documents]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      loop_id:
        from: [documents.loop_id]
        required: true
      loop_name:
        from: [documents.loop_name]
        required: false
      corrosion_mechanism:
        from: [documents.corrosion_mechanism]
        required: true
        description: "general | pitting | stress_corrosion | erosion | crevice | galvanic | mic | high_temp_h2 | caustic | amine | co2 | h2s"
      corrosion_rate_mmpy:
        from: [documents.corrosion_rate]
        required: false
      design_pressure:
        from: [documents.design_pressure]
        required: false
      design_temperature:
        from: [documents.design_temperature]
        required: false
      material_of_construction:
        from: [documents.material_of_construction]
        required: false

  # ── Thickness Measurement (asset integrity) ──────────────────────────────────
  thickness_measurement:
    canonical_table: thickness_measurement
    identity_keys: [plant_code_id, normalized_asset, measurement_point, measurement_date]
    sources: [documents]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      normalized_asset:
        from: [documents.normalized_asset]
        required: true
      measurement_point:
        from: [documents.measurement_point]
        required: true
      measurement_date:
        from: [documents.measurement_date]
        required: true
      nominal_thickness_mm:
        from: [documents.nominal_thickness]
        required: false
      measured_thickness_mm:
        from: [documents.measured_thickness]
        required: true
      min_required_thickness_mm:
        from: [documents.min_required_thickness]
        required: false
      remaining_life_years:
        from: [documents.remaining_life]
        required: false
      corrosion_loop_id:
        from: [documents.loop_id]
        required: false

  # ── Condition Assessment (asset integrity — ISO 55000) ───────────────────────
  condition_assessment:
    canonical_table: condition_assessment
    identity_keys: [plant_code_id, normalized_asset, assessment_date]
    sources: [documents, computed]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id, computed.plant_code_id]
        required: true
      normalized_asset:
        from: [documents.normalized_asset, computed.normalized_asset]
        required: true
      assessment_date:
        from: [documents.assessment_date, computed.assessment_date]
        required: true
      health_index:
        from: [computed.health_index]
        required: false
        description: "0-100 score; 100=perfect condition"
      condition_grade:
        from: [documents.condition_grade, computed.condition_grade]
        required: false
        description: "A=excellent, B=good, C=fair, D=poor, E=very_poor"
      remaining_useful_life_years:
        from: [computed.remaining_useful_life]
        required: false
      risk_score:
        from: [computed.risk_score]
        required: false
        description: "consequence × probability (API 581)"
      consequence_category:
        from: [documents.consequence_category]
        required: false
        description: "safety | environmental | production | financial"
      probability_category:
        from: [documents.probability_category]
        required: false

  # ── Process Parameter (process optimization) ─────────────────────────────────
  process_parameter:
    canonical_table: process_parameter
    identity_keys: [plant_code_id, tag_name, parameter_type]
    sources: [timeseries, documents]
    attributes:
      plant_code_id:
        from: [timeseries.plant_code_id, documents.plant_code_id]
        required: true
      tag_name:
        from: [timeseries.tag_name, documents.tag_name]
        required: true
      parameter_type:
        from: [documents.parameter_type]
        required: true
        description: "setpoint | target | optimal_range | control_limit"
      value_low:
        from: [documents.value_low]
        required: false
      value_target:
        from: [documents.value_target]
        required: false
      value_high:
        from: [documents.value_high]
        required: false
      unit:
        from: [timeseries.unit, documents.unit]
        required: false
      process_unit_code:
        from: [documents.process_unit_code]
        required: false

  # ── Process Alarm (process optimization — ISA-18.2) ──────────────────────────
  process_alarm:
    canonical_table: process_alarm
    identity_keys: [plant_code_id, alarm_id]
    sources: [timeseries]
    attributes:
      plant_code_id:
        from: [timeseries.plant_code_id]
        required: true
      alarm_id:
        from: [timeseries.alarm_id]
        required: true
      tag_name:
        from: [timeseries.tag_name]
        required: true
      alarm_type:
        from: [timeseries.alarm_type]
        required: false
      alarm_priority:
        from: [timeseries.alarm_priority]
        required: false
      alarm_time:
        from: [timeseries.alarm_time]
        required: true
      return_to_normal_time:
        from: [timeseries.rtn_time]
        required: false
      acknowledged_time:
        from: [timeseries.ack_time]
        required: false
      duration_seconds:
        from: [timeseries.duration_seconds]
        required: false

  # ── Safety Instrumented Function (process optimization — IEC 61511) ──────────
  safety_instrumented_function:
    canonical_table: safety_instrumented_function
    identity_keys: [plant_code_id, sif_id]
    sources: [documents]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      sif_id:
        from: [documents.sif_id]
        required: true
      sif_name:
        from: [documents.sif_name]
        required: false
      sil_rating:
        from: [documents.sil_rating]
        required: true
      process_unit_code:
        from: [documents.process_unit_code]
        required: false
      hazard_description:
        from: [documents.hazard_description]
        required: false
      demand_mode:
        from: [documents.demand_mode]
        required: false
      pfd_avg:
        from: [documents.pfd_avg]
        required: false
      proof_test_interval_months:
        from: [documents.proof_test_interval]
        required: false

  # ── Safety Loop (process optimization) ───────────────────────────────────────
  safety_loop:
    canonical_table: safety_loop
    identity_keys: [plant_code_id, sif_id, loop_element_seq]
    sources: [documents]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      sif_id:
        from: [documents.sif_id]
        required: true
      loop_element_seq:
        from: [documents.loop_element_seq]
        required: true
      element_type:
        from: [documents.element_type]
        required: true
      tag_name:
        from: [documents.tag_name]
        required: false
      normalized_asset:
        from: [documents.normalized_asset]
        required: false
      manufacturer:
        from: [documents.manufacturer]
        required: false
      model:
        from: [documents.model]
        required: false
      failure_rate:
        from: [documents.failure_rate]
        required: false

  # ── Proof Test (process optimization — IEC 61511) ────────────────────────────
  proof_test:
    canonical_table: proof_test
    identity_keys: [plant_code_id, sif_id, test_date]
    sources: [documents, sap_wo]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id, sap_wo.plant_code_id]
        required: true
      sif_id:
        from: [documents.sif_id]
        required: true
      test_date:
        from: [documents.test_date, sap_wo.actual_finish]
        required: true
      test_result:
        from: [documents.test_result]
        required: true
      test_coverage_pct:
        from: [documents.test_coverage_pct]
        required: false
      tester:
        from: [documents.tester]
        required: false
      related_wo_number:
        from: [sap_wo.wo_number]
        required: false
      findings:
        from: [documents.findings]
        required: false

  # ── Process KPI (process optimization) ───────────────────────────────────────
  process_kpi:
    canonical_table: process_kpi
    identity_keys: [plant_code_id, process_unit_code, kpi_name, period_start]
    sources: [computed]
    attributes:
      plant_code_id:
        from: [computed.plant_code_id]
        required: true
      process_unit_code:
        from: [computed.process_unit_code]
        required: false
      kpi_name:
        from: [computed.kpi_name]
        required: true
      period_start:
        from: [computed.period_start]
        required: true
      period_end:
        from: [computed.period_end]
        required: true
      kpi_value:
        from: [computed.kpi_value]
        required: true
      kpi_unit:
        from: [computed.kpi_unit]
        required: false
      target_value:
        from: [computed.target_value]
        required: false

  # ── Emission Record (sustainability — GHG Protocol) ──────────────────────────
  emission_record:
    canonical_table: emission_record
    identity_keys: [plant_code_id, emission_source_id, period_start]
    sources: [timeseries, documents, computed]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id, computed.plant_code_id]
        required: true
      emission_source_id:
        from: [documents.emission_source_id]
        required: true
      emission_source_name:
        from: [documents.emission_source_name]
        required: false
      ghg_scope:
        from: [documents.ghg_scope]
        required: true
        description: "scope_1 | scope_2 | scope_3"
      gas_type:
        from: [documents.gas_type]
        required: true
        description: "co2 | ch4 | n2o | hfc | pfc | sf6 | nf3"
      period_start:
        from: [computed.period_start]
        required: true
      period_end:
        from: [computed.period_end]
        required: true
      quantity_tonnes:
        from: [computed.quantity_tonnes]
        required: true
      co2_equivalent_tonnes:
        from: [computed.co2e_tonnes]
        required: true
      emission_factor_id:
        from: [documents.emission_factor_id]
        required: false
      process_unit_code:
        from: [documents.process_unit_code]
        required: false
      normalized_asset:
        from: [documents.normalized_asset]
        required: false

  # ── Emission Factor (sustainability) ─────────────────────────────────────────
  emission_factor:
    canonical_table: emission_factor
    identity_keys: [factor_id]
    sources: [standards, documents]
    attributes:
      factor_id:
        from: [standards.factor_id, documents.factor_id]
        required: true
      source_name:
        from: [standards.source_name]
        required: false
        description: "EPA | IPCC | EU_ETS | custom"
      gas_type:
        from: [standards.gas_type]
        required: true
      activity_type:
        from: [standards.activity_type]
        required: true
        description: "fuel_combustion | electricity | fugitive | process | transport"
      factor_value:
        from: [standards.factor_value]
        required: true
      factor_unit:
        from: [standards.factor_unit]
        required: true
      gwp:
        from: [standards.gwp]
        required: false
      effective_year:
        from: [standards.effective_year]
        required: false

  # ── Water Record (sustainability — ISO 14001) ───────────────────────────────
  water_record:
    canonical_table: water_record
    identity_keys: [plant_code_id, water_source_id, period_start]
    sources: [timeseries, documents, computed]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id, computed.plant_code_id]
        required: true
      water_source_id:
        from: [documents.water_source_id]
        required: true
      record_type:
        from: [documents.record_type]
        required: true
        description: "intake | discharge | recycled | consumed"
      water_type:
        from: [documents.water_type]
        required: false
        description: "freshwater | seawater | brackish | produced_water | cooling_water"
      period_start:
        from: [computed.period_start]
        required: true
      period_end:
        from: [computed.period_end]
        required: true
      volume_m3:
        from: [computed.volume_m3]
        required: true
      quality_parameters:
        from: [documents.quality_parameters]
        required: false

  # ── Waste Record (sustainability) ────────────────────────────────────────────
  waste_record:
    canonical_table: waste_record
    identity_keys: [plant_code_id, waste_stream_id, period_start]
    sources: [documents, computed]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      waste_stream_id:
        from: [documents.waste_stream_id]
        required: true
      waste_classification:
        from: [documents.waste_classification]
        required: true
        description: "hazardous | non_hazardous | inert"
      waste_type:
        from: [documents.waste_type]
        required: false
      disposal_method:
        from: [documents.disposal_method]
        required: false
      period_start:
        from: [computed.period_start]
        required: true
      period_end:
        from: [computed.period_end]
        required: true
      quantity_tonnes:
        from: [computed.quantity_tonnes]
        required: true
      process_unit_code:
        from: [documents.process_unit_code]
        required: false

  # ── Environmental Permit (sustainability) ────────────────────────────────────
  environmental_permit:
    canonical_table: environmental_permit
    identity_keys: [plant_code_id, permit_id]
    sources: [documents]
    attributes:
      plant_code_id:
        from: [documents.plant_code_id]
        required: true
      permit_id:
        from: [documents.permit_id]
        required: true
      permit_type:
        from: [documents.permit_type]
        required: true
        description: "air | water | waste | noise | operational"
      issuing_authority:
        from: [documents.issuing_authority]
        required: false
      issued_date:
        from: [documents.issued_date]
        required: true
      expiry_date:
        from: [documents.expiry_date]
        required: true
      limit_parameter:
        from: [documents.limit_parameter]
        required: false
      limit_value:
        from: [documents.limit_value]
        required: false
      limit_unit:
        from: [documents.limit_unit]
        required: false
      compliance_status:
        from: [documents.compliance_status]
        required: false
        description: "compliant | non_compliant | pending_review"

  # ── ESG KPI (sustainability — GRI, SASB) ─────────────────────────────────────
  esg_kpi:
    canonical_table: esg_kpi
    identity_keys: [plant_code_id, kpi_name, reporting_period_start]
