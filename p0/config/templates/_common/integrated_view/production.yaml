domain: production
label: Production
description: 'Operating-mode and throughput view of each asset — how it''s running against target/limit,
  what''s constraining it, the plan/procedure/control response, and the resulting cost/business impact.

  '
layers:
  asset:
    standard: ISO 15926, ISO 14224, ISA-95, ISO 8000
    fields:
    - name: Equipment
      status: backed
      key_column: normalized_asset
      source_label: Asset Master
      sources:
      - table: equipment
        column: equipment_tag
        label: Asset Master
      - table: inspection_record_aif
        column: functional_location
        label: AIF FLOC
      - table: containment_event_gloc
        column: equipment_ref
        label: GLOC
    - name: Area
      status: backed
      key_column: normalized_asset
      source_label: Asset Master
      sources:
      - table: equipment
        column: area
        label: Asset Master
      - table: inspection_record_aif
        column: platform
        label: AIF
      - table: containment_event_lopc
        column: location
        label: LOPC
    - name: Process Unit
      status: backed
      source_table: equipment
      source_column: process_unit
      key_column: normalized_asset
      source_label: Asset Master
    - name: Component
      status: backed
      key_column: equipment_id
      source_label: SAP
      sources:
      - table: failure_mode
        column: subsystem_component
        label: SAP
      - table: containment_event_lopc
        column: component_type
        label: LOPC
    - name: Sensor / Tag
      status: backed
      source_table: timeseries_metadata
      source_column: tag_name
      key_column: normalized_asset
      source_label: Historian
  process:
    standard: ISO 15926, ISA-88/95
    fields:
    - name: Process Stream
      status: not_yet_backed
      note: No stream/flow-path column exists anywhere in schema.yaml.
    - name: Process Variable
      status: backed
      derivation: tag_first_letter_lookup
      source_table: timeseries_metadata
      source_column: tag_name
      key_column: normalized_asset
      source_label: Historian
      reference_file: config/templates/_common/tag_naming_convention.json
      note: 'Derived, not a raw column: the tag''s first ISA-5.1 letter is looked up in tag_naming_convention.json''s
        isa_5_1.first_letter map to get the variable name (Temperature, Flow, ΔT via a differential/D
        modifier, ...). Standard: ANSI/ISA-5.1-2009.

        '
    - name: Operating Mode
      status: backed
      source_table: operating_state_log
      source_column: operating_state
      key_column: normalized_asset
      source_label: Historian
  performance:
    standard: ISO 14224, IEC 61511, ISO 22400
    fields:
    - name: KPI
      status: not_yet_backed
      note: No generic KPI-name column exists anywhere in base schema.yaml. Represents category-level
        names (e.g. 'Throughput', 'Energy Efficiency') from industry_config.yaml's kpis.production catalog,
        not backed by a per-equipment row today.
    - name: Target Value
      status: not_yet_backed
      note: No setpoint/target column exists anywhere in schema.yaml -- timeseries_metadata only carries
        op_limit_*/safety_limit_*/trip_limit_* (limits, not targets).
    - name: Operating Limit
      status: backed
      source_table: timeseries_metadata
      source_column: op_limit_h
      key_column: normalized_asset
      source_label: Historian
  knowledge:
    standard: ISO 14224, IEC 61511, DAMA-DMBOK
    fields:
    - name: Process Constraint
      status: not_yet_backed
      note: No named-constraint column exists anywhere in schema.yaml (timeseries_metadata's op_limit_h
        is a VALUE, not a constraint description like 'Pump capacity').
    - name: Rule / Knowledge
      status: not_yet_backed
      note: This is the Symbolic AI / Rule Engine's output (e.g. 'High temperature reduces yield') --
        explicitly deferred/out of scope this phase, no backing table exists yet.
  action:
    standard: IEC 62443, ISA-88, IEC 61511
    fields:
    - name: Production Plan
      status: not_yet_backed
      note: No production-plan/schedule table exists in base schema.yaml (maintenance_plan exists but
        that's maintenance scheduling, a different concept).
    - name: Procedure / SOP
      status: backed
      source_table: document_metadata
      source_column: title
      key_column: equipment_id
      source_label: SOP
      filter:
        document_type: sop
    - name: Work Order
      status: backed
      key_column: equipment_ref
      source_label: SAP Work Order
      sources:
      - table: work_order
        column: wo_number
        label: SAP Work Order
      - table: inspection_record_aif
        column: work_order_no
        label: AIF
      - table: containment_event_gloc
        column: work_order_no
        label: GLOC
    - name: Control Action
      status: not_yet_backed
      note: No free-text operator/control-action column exists anywhere in schema.yaml (e.g. 'Reduce feed
        rate', 'Increase pump speed').
    - name: Recommendation
      status: backed
      sources:
      - table: inspection_record_aif
        column: recommendation
        label: AIF
      - table: containment_event_gloc
        column: recommendation
        label: GLOC
      key_column: normalized_asset
    - name: Safety Event
      status: backed
      key_column: equipment_id
      source_label: Process Safety Event
      standard: IEC 61511 (loss-of-containment scope); API 754 (PSE tiering)
      sources:
      - table: document_metadata
        column: document_type
        label: Process Safety Event
      - table: containment_event_lopc
        column: incident_classification
        label: LOPC
      - table: containment_event_gloc
        column: fault_code
        label: GLOC
  business:
    standard: ISA-95, ISO 50001
    fields:
    - name: Production Cost
      status: not_yet_backed
      note: No cost/currency column exists anywhere in schema.yaml.
    - name: Business Objective
      status: not_yet_backed
      note: asset_strategy.notes is free text and not a reliable semantic match -- not claiming it as
        backed.
