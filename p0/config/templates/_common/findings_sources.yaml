# Controlled vocabularies, folded to canonical form on read.
vocabularies:
  incident_classification:
    slight_release: [Slight Release, Slight release, Slight, Minor/Slight Release]
    minor_release: [Minor Release, Minor release, Minor]
    major_release: [Major Release, Major release, Major]
    tier_1: [Tier 1, TIER 1, T1]
    tier_2: [Tier 2, TIER 2, T2]
  severity:
    low: [Low, LOW, L, Minor]
    medium: [Medium, MEDIUM, M, Moderate]
    high: [High, HIGH, H, Major]
    critical: [Critical, CRITICAL, C, Severe]
  final_status:
    open: [Open, OPEN, Active, Outstanding]
    closed: [Closed, CLOSED, Complete, Completed]
    overdue: [Overdue, OVERDUE, Past Due]
    pending: [Pending, Pending Screen, In Progress, Under Review]
