version: '1.1'
notes:
- P&ID extracted tables may vary by tool; include common aliases. Prefer producing
  canonical columns used by CDM.
- Header keys match separator- and case-insensitively, so "Equipment Tag",
  "equipment_tag", "EQUIPMENT-TAG" and "Equipment.Tag" are one key. Declare one
  spelling of each, not four.
- A target must be a name some pid entity attribute reads in entities.yaml.
  Anything else is silently dropped downstream.
- target_priority decides which header wins when several map to one target.
  Without it the winner is the uploaded file's column order.
- pid_connectivity is for the connectivity sheet only. It inherits every pid
  mapping and overrides the few headers that mean something else there. A "Type"
  column on an equipment sheet is the equipment type, while on a connectivity
  sheet the same header is the connection type.
