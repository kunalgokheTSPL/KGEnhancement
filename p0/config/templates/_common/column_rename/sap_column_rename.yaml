version: '1.0'
notes:
- Raw→canonical rename mappings for SAP PM/MM extracts.
- Includes both SAP technical field names (e.g., EQUNR, TPLNR, AUFNR) and common ALV/report
  headers (e.g., Equipment, Functional Location).
- Downstream CDM expects canonical names produced by these mappings plus derived_fields.yaml.
