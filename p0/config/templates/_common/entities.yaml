# ================================================================
# COMMON — Core Entity Definitions
# ================================================================
# Shared entities present in ALL use-case profiles.
# Use-case overlays ADD entities; they never remove these.
# ================================================================

entities:

  # =========================
  # CORE ASSET / PROCESS LAYER
  # =========================

  equipment:
    canonical_table: equipment
    identity_keys: [plant_code_id, normalized_asset]
    sources: [sap_assets, pid, documents, timeseries]
    attributes:
      plant_code_id:
        from: [sap_assets.plant_code_id, pid.plant_code_id, documents.plant_code_id, timeseries.plant_code_id]
        required: true
      normalized_asset:
        from: [sap_assets.normalized_asset, pid.normalized_asset, documents.normalized_asset, timeseries.normalized_asset]
        required: true
      canonical_code:
        from: [sap_assets.normalized_asset, pid.normalized_asset, timeseries.normalized_asset, documents.normalized_asset]
        required: false
      equipment_id:
        from: [sap_assets.equipment_id, pid.equipment_id, pid.equipment_tag, pid.normalized_asset]
      sap_equipment_id:
        from: [sap_assets.sap_equipment_id, sap_assets.equipment_id]
      equipment_tag:
        from: [sap_assets.equipment_tag, pid.equipment_tag, documents.equipment_tag]
      functional_location:
        from: [sap_assets.functional_location, pid.functional_location, documents.functional_location]
      equipment_type:
        from: [sap_assets.equipment_type, pid.equipment_type]
      area:
        from: [sap_assets.area, pid.area, documents.area]
      process_unit:
        from: [pid.process_unit, sap_assets.process_unit, documents.process_unit]
      line:
        from: [pid.line, sap_assets.line, documents.line]
      criticality:
        from: [sap_assets.criticality, pid.criticality, documents.criticality]
      description:
        from: [sap_assets.description, pid.description, documents.description]
      manufacturer:
        from: [sap_assets.manufacturer, pid.manufacturer, documents.manufacturer]
      model:
        from: [sap_assets.model, pid.model, documents.model]
      status:
        from: [sap_assets.status, pid.status]
      source_system:
        from: [sap_assets.source_system, pid.source_system, documents.source_system, timeseries.source_system]

  equipment_pid:
    canonical_table: equipment_pid
    identity_keys: [plant_code_id, pid_tag]
    sources: [pid]
    attributes:
      plant_code_id:
        from: [pid.plant_code_id]
        required: true
      pid_tag:
        from: [pid.equipment_tag, pid.normalized_asset]
        required: true
      equipment_id:
        from: [pid.equipment_id, pid.equipment_tag, pid.normalized_asset]
      normalized_asset:
        from: [pid.normalized_asset]
      equipment_type:
        from: [pid.equipment_type]
      area:
        from: [pid.area]
      process_unit:
        from: [pid.process_unit]
      line:
        from: [pid.line]
      description:
        from: [pid.description]
      functional_location:
        from: [pid.functional_location]
      source_system:
        from: [pid.source_system]

  timeseries_metadata:
    canonical_table: timeseries_metadata
    identity_keys: [plant_code_id, tag_name]
    sources: [timeseries, osi_pi, alerts_prime_alarms, alerts_prime_excursions, alerts_protean]
    source_attribute_prefixes: [pi_, alerts_prime_, protean_]
    attributes:
      plant_code_id:
        from: [timeseries.plant_code_id, osi_pi.plant_code_id, alerts_prime_alarms.plant_code_id, alerts_prime_excursions.plant_code_id, alerts_protean.plant_code_id]
        required: true
      tag_name:
        from: [timeseries.tag_name, osi_pi.tag_name, alerts_prime_alarms.tag_name, alerts_prime_excursions.tag_name, alerts_protean.tag_name]
